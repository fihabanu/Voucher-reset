name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show real error (only if build failed)
        if: failure()
        shell: bash
        run: |
          echo "=============== REAL ERROR (copy this part) ==============="
          n=$(grep -n "Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            start=$((n-70)); [ $start -lt 1 ] && start=1
            sed -n "${start},${n}p" build.log
          else
            tail -n 80 build.log
          fi
          echo "=============== END ==============="

      - name: Upload full log (only if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoucherManager-APK
          path: bin/*.apk
